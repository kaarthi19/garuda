# scenario_timor.yml
#
# Timor village-solar study (real data, four kabupaten — see
# docs/ntt_data_integration.md). Datasets are built by:
#   python -m tools.ntt.build_timor --src-dir <workbooks> [--kabupaten belu]
#
# gridvillage co-optimises each village's solar + battery + existing diesel and
# its grid connection: a solar-rich village can connect and export surplus to
# supplement deficit villages, or stay an islanded microgrid if connecting isn't
# worth the interconnection cost (village_connection.csv).
#
# Start with the smallest kabupaten (timor_belu, 81 villages) to verify, then
# scale to the full island (timor, ~780 villages).

# Full Timor island = all four kabupaten (~780 villages). For a quick test,
# swap `timor` for `timor_belu` (81 villages) and rebuild with
#   python -m tools.ntt.build_timor --src-dir <workbooks> --kabupaten belu
islands:
  - timor

years:
  - "2030"

# Both halves of the coordination question. Running only `gridvillage` gives a
# cost with nothing to compare it against — the coordination value is the
# DIFFERENCE between the two, so a lone gridvillage run answers nothing.
scenarios:
  - village       # coordination OFF — each village an islanded solar+battery+diesel microgrid
  - gridvillage   # coordination ON  — villages may connect and trade surplus

cleans:
  - reference

# Optional model parameters passed through to every job's config.json.
# Every key here must also appear in PASSTHROUGH_KEYS in generate_jobs.py /
# generate_jobs_local.py, or it is silently dropped and the run solves at the
# model default while the output CSVs look completely normal.
mipgap: 0.01

# ---------------------------------------------------------------------------
# Grid import price ($/MWh a site pays for an imported MWh).
#
# SET TO 0 DELIBERATELY. This model is a single central-planner cost
# minimisation, and the objective already contains `eVariableCostsGrid` — the
# fuel and O&M the grid burns to generate whatever a site imports (the zonal
# balance forces it to). `import_price` adds `eGridImportCosts` ON TOP of that,
# so a non-zero value charges the same MWh twice: at Timor's diesel margin,
# ~$197/MWh of real resource cost plus the tariff.
#
# A tariff is a TRANSFER between parties, not a resource cost. It belongs in a
# merchant or affordability framing, not in a system-optimal one — and the
# system-optimal result is the agreed deliverable.
#
# The shipped default of 59.0 is also an industrial/commercial tariff, not a
# village one: PLN household rates are roughly $26/MWh on the subsidised
# lifeline or ~$90/MWh non-subsidised.
#
# This matters for the headline. With a non-zero import price and no offsetting
# export credit (export_price = 0), every inter-village transfer carries a
# one-sided deadweight charge — one of the two candidate explanations for the
# measured "coordination value is ~0" that no run has yet separated. Sweep it:
#   docs/run_plan_timor.md, group A5.
import_price: 0.0

# Baseline BAU CO2 emissions (tonnes CO2).
#
# WARNING — PLACEHOLDER, DO NOT RUN A DECARBONISATION SCENARIO OFF THIS.
# Timor's actual village fleet emits roughly 75,000 tCO2/yr (~98 GWh of village
# diesel at ~0.77 tCO2/MWh), so 3,000,000 t is about 40x slack: the cap cannot
# bind, and a `clean` run would report "the CO2 constraint costs nothing" as a
# modelling artifact rather than a result. Set these from measured emissions
# (clean_energy_results.csv::CO2_Emissions_Village on a reference run) before
# using them. See docs/scenario_design_timor.md.
island_params:
  timor: 3000000

co2_limits:
  "2030":
    timor: 3000000
