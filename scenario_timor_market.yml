# scenario_timor_market.yml
#
# The export programme: can Timor's villages profitably supply the grid?
#
# This is NOT answerable on the plain `timor` dataset. There, `demand_z1 = 0` for
# all 1344 hours, the grid zone has no storage, and `vGEN >= 0` means a generator
# cannot absorb power — so the zonal balance forces
#     Σ village export <= Σ village import
# in every hour. Village↔village sharing is representable; village→grid *sales*
# are not. A run on `timor` with `export_price > 0` measures a data artifact, and
# on a zero-grid-demand dataset a price above `import_price` lets a village pair
# transact with no physical generation at all (see docs/scenario_design_timor.md).
#
# So build the market dataset first — a real grid load plus a real fleet:
#
#   python -m tools.ntt.build_grid_demand --share 0.42 \
#       --out-dataset timor__market --fleet rescale
#
# That derives `demand_z1` from the NTT zone-2 (East Nusa Tenggara) series, net of
# the village load already modelled as separate nodes, and transplants a fleet so
# the balance does not close on non-served energy at Voll (~$2,000/MWh). Verified
# on the shipped data: 682 GWh/yr, 124 MW peak, grid NSE = 0.
#
# `timor__market` is a DERIVED dataset (gitignored via data_indonesia/*/*__*/).
# Regenerate it rather than expecting it in a fresh clone.

islands:
  - timor__market

years:
  - "2030"

# Both halves — the export question is a comparison, not a single number.
scenarios:
  - village       # coordination OFF — islanded microgrids, no grid interaction
  - gridvillage   # coordination ON  — villages may connect, import and export

cleans:
  - reference

# ---------------------------------------------------------------------------
# Optional model parameters. EVERY key below must also appear in
# PASSTHROUGH_KEYS (generate_jobs.py / generate_jobs_local.py) or it is silently
# dropped: the job's config.json never carries it, the model solves at its
# default, and the result CSVs look entirely normal.
# ---------------------------------------------------------------------------
mipgap: 0.01

# Feed-in price ($/MWh) paid for village exports. 0 = exports are an
# unremunerated spill path (the shipped reference behaviour).
#
# NOTE on framing: the model is a single central-planner cost minimisation, so
# once the grid bus carries real load an exported MWh is ALREADY valued at zonal
# marginal cost with export_price at 0. This key is a shadow tariff, not a firm's
# revenue — do not read it as a merchant business case.
#
# Keep export_price <= import_price (59.0). Above it, a connected village profits
# from importing and re-exporting; run_model.jl warns, but the warning describes
# your result rather than preventing it.
export_price: 0.0

# Scope of the `clean` policy constraints: "grid" (village layer outside both the
# CO2 cap and the RE floor) or "system" (village generation and demand included).
policy_scope: grid

# Gurobi LP algorithm; -1 = automatic. 2 (barrier) avoids the concurrent-spin
# overhead Gurobi reports at 780-village scale. Ignored under HiGHS.
lp_method: -1

# Suffix for the results folder. Essential when two runs differ ONLY by config
# keys — without it an export-price ladder writes every point to one directory
# and the summary reports the last run once per row.
run_tag: ""

# Baseline BAU CO2 emissions (tonnes CO2).
#
# WARNING — PLACEHOLDER, inherited from scenario_timor.yml. Timor's village fleet
# emits roughly 75,000 tCO2/yr, so 3,000,000 t is ~40x slack and cannot bind. Set
# these from measured emissions before running anything `clean`.
island_params:
  timor__market: 3000000

co2_limits:
  "2030":
    timor__market: 3000000
